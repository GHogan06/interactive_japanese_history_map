<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline of Japanese History Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles/style.css">

</head>

<body>
    <h1>Map and Timeline of Japanese History</h1>
    <div id="info_map_container">
        <div id="info_box">
            <div class="leaders_boxes">
            </div>
            <div class="events_section">
                <h3>Events in <span id="current_year_display">----</span> | <span
                        id="current_period_display">----</span></h3>
                <div id="events_list_container">

                </div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <div id="timeline_slider">
        <div id="input_slider_container">
            <input type="range" name="time_slider" id="year_slider" min="-660" max="2026" value="-660">
        </div>

        <div id="selected_year_box"></div>
        <div id="slider_buttons">
            <button id="back_event_button">&lt;<br>Last Event</button>
            <button id="back_year_button">&lt;<br>Year</button>
            <button id="forward_year_button">&gt;<br>Year</button>
            <button id="forward_event_button">&gt;<br>Next Event</button>
        </div>

    </div>
</body>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
    </script>

<script type="module" src="scripts/main_script.js"></script>


</html>
